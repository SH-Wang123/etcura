name: Release

# Builds every supported platform/arch on native runners and publishes a
# GitHub Release with per-platform archives + sha256 checksums.
#
# - Pushing a tag `v*` builds AND creates the release. Release notes come
#   from `.github/releases/<tag>.md` when present, otherwise generated.
# - Manual dispatch (workflow_dispatch) builds only — handy to test the
#   matrix before tagging.

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "22"
  WAILS_VERSION: v2.15.0

jobs:
  test:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin/arm64
            artifact: etcura-darwin-arm64
          - os: macos-14
            platform: darwin/amd64
            artifact: etcura-darwin-amd64
          - os: macos-14
            platform: darwin/universal
            artifact: etcura-darwin-universal
          - os: windows-latest
            platform: windows/amd64
            artifact: etcura-windows-amd64
          - os: windows-latest
            platform: windows/arm64
            artifact: etcura-windows-arm64
          - os: ubuntu-latest
            platform: linux/amd64
            artifact: etcura-linux-amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            artifact: etcura-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libnss3-dev pkg-config xvfb xauth
          # Wails v2 still looks for the webkit2gtk-4.0 pkg-config module, which
          # Ubuntu 24.04 dropped (only 4.1 ships now). The 4.1 headers/libs are
          # API-compatible for what Wails uses, so alias the .pc file.
          PCDIR="$(pkg-config --variable=pcfiledir webkit2gtk-4.1)"
          sudo cp "$PCDIR/webkit2gtk-4.1.pc" "$PCDIR/webkit2gtk-4.0.pc"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build
        shell: bash
        run: wails build -platform "${{ matrix.platform }}"

      - name: Smoke test Linux startup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          result=0
          xvfb-run -a timeout 8s ./build/bin/etcura || result=$?
          test "$result" -eq 124

      - name: Smoke test Windows startup
        if: matrix.platform == 'windows/amd64'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath (Resolve-Path 'build/bin/etcura.exe') -PassThru
          try {
            for ($i = 0; $i -lt 25; $i++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Etcura exited with code $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { return }
            }
            throw "Etcura did not create a window"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id }
          }

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          ditto -c -k --sequesterRsrc --keepParent etcura.app \
            "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/bin/etcura.exe -DestinationPath "$env:GITHUB_WORKSPACE/${{ matrix.artifact }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd build/bin
          zip -q "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" etcura

      - name: Checksum
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          # macOS runners ship shasum instead of GNU sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
          fi
          cat "${{ matrix.artifact }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: [test, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist/
          NOTES_FILE=".github/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES_FILE" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Etcura $GITHUB_REF_NAME" \
              --notes-file "$NOTES_FILE"
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Etcura $GITHUB_REF_NAME" \
              --generate-notes
          fi
